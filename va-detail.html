<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitsune — VA Dossiers & Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="bg-teal-950 border-b border-teal-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-xl font-bold text-white">VA Dossiers & Daily Logs</h1>
      <p class="text-xs text-teal-300">Sheet-synced shift logs + Tasks/Focuses &amp; VA profile dossiers</p>
    </div>
    <nav id="main-nav" class="flex flex-wrap gap-2"></nav>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-5">
    <!-- Clickable & Draggable VA Pill Strip -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
      <div class="space-y-2.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2.5">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active VA Tabs:</span>
            <span class="text-[10px] text-slate-500 hidden sm:inline">(Drag pills to reorder)</span>
            <button id="reset-pill-order-btn" type="button"
                    class="hidden text-[10px] text-amber-300 hover:text-amber-200 underline font-semibold cursor-pointer">
              ↺ Reset to Overview Order
            </button>
          </div>

          <div class="flex flex-wrap items-center gap-2">
            <a id="open-brief-link" href="#" target="_blank" rel="noopener noreferrer"
               class="hidden px-3 py-1.5 rounded-lg bg-teal-900/70 hover:bg-teal-800 border border-teal-700 text-xs text-teal-200 font-medium">
              Open Account Brief ↗
            </a>
          </div>
        </div>

        <div id="va-pill-bar" class="flex flex-wrap items-center gap-2">
          <span class="text-xs text-slate-500">Loading VA tabs...</span>
        </div>
      </div>
    </div>

    <!-- SITE-ONLY VA DOSSIER & CLIENT ASSIGNMENT CARD (Minimized SS2 Default + Expand/Collapse + Unified Save) -->
    <section id="va-dossier-section" class="hidden space-y-4"></section>

    <div id="save-toast" class="hidden px-4 py-2 rounded-lg bg-emerald-900/80 border border-emerald-600 text-emerald-200 text-sm"></div>

    <!-- Daily Shift Log Table (with Global Date Range Filter, RL/EL Flags, Per-Date Tasks/Focuses & AM Comms) -->
    <div id="tab-content" class="overflow-x-auto bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <p class="text-slate-500 text-sm">Select a synced tab above, or go to <a href="tabs.html" class="text-teal-400 underline">Select Tabs</a> to enable tabs.</p>
    </div>
  </main>

  <script type="module" src="./js/va-detail.js"></script>
</body>
</html>
