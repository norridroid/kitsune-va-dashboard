<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitsune — VA Dossiers & Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="bg-teal-950 border-b border-teal-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-xl font-bold text-white">VA Dossiers & Daily Logs</h1>
      <p class="text-xs text-teal-300">Sheet-synced shift logs + site-only SOW alignment & VA profile dossiers</p>
    </div>
    <nav id="main-nav" class="flex flex-wrap gap-2"></nav>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-5">
    <!-- Clickable VA Pill Strip & Sheet-Synced Row 2 Schedule / Account Brief -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-4">
      <div class="space-y-2.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active VA Tabs:</span>

          <div class="flex flex-wrap items-center gap-2">
            <button id="toggle-sow-drawer-btn" type="button"
                    class="hidden px-3 py-1.5 rounded-lg bg-blue-900/70 hover:bg-blue-800 border border-blue-600 text-xs text-blue-100 font-semibold">
              🎯 Weekly SOW / Daily Tasks
            </button>
            <a id="open-brief-link" href="#" target="_blank" rel="noopener noreferrer"
               class="hidden px-3 py-1.5 rounded-lg bg-teal-900/70 hover:bg-teal-800 border border-teal-700 text-xs text-teal-200 font-medium">
              Open Account Brief ↗
            </a>
          </div>
        </div>

        <div id="va-pill-bar" class="flex flex-wrap items-center gap-2">
          <span class="text-xs text-slate-500">Loading VA tabs...</span>
        </div>
      </div>

      <!-- Sheet-Synced Row 2 Editor -->
      <div id="schedule-editor" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3 pt-3 border-t border-slate-800 items-end">
        <div class="lg:col-span-2">
          <label class="block text-[11px] text-slate-400 uppercase mb-1">Shift Type (Sheet)</label>
          <input id="edit-shift-type" type="text" placeholder="Full Time"
                 class="w-full px-2.5 py-1.5 rounded bg-slate-800 border border-slate-700 text-xs text-white focus:border-teal-500 focus:outline-none" />
        </div>
        <div class="lg:col-span-2">
          <label class="block text-[11px] text-slate-400 uppercase mb-1">Start Time (Sheet)</label>
          <input id="edit-start-time" type="text" placeholder="6:00AM"
                 class="w-full px-2.5 py-1.5 rounded bg-slate-800 border border-slate-700 text-xs text-white focus:border-teal-500 focus:outline-none" />
        </div>
        <div class="lg:col-span-2">
          <label class="block text-[11px] text-slate-400 uppercase mb-1">End Time (Sheet)</label>
          <input id="edit-end-time" type="text" placeholder="2:00PM"
                 class="w-full px-2.5 py-1.5 rounded bg-slate-800 border border-slate-700 text-xs text-white focus:border-teal-500 focus:outline-none" />
        </div>
        <div class="lg:col-span-4">
          <label class="block text-[11px] text-slate-400 uppercase mb-1">Account Brief URL (Passed to Sheet)</label>
          <input id="edit-brief-url" type="url" placeholder="https://docs.google.com/..."
                 class="w-full px-2.5 py-1.5 rounded bg-slate-800 border border-slate-700 text-xs text-white focus:border-teal-500 focus:outline-none" />
        </div>
        <div class="lg:col-span-2">
          <button id="save-schedule-btn" type="button"
                  class="w-full px-3 py-1.5 rounded bg-teal-600 hover:bg-teal-500 text-white text-xs font-semibold">
            Save Row 2 to Sheet
          </button>
        </div>
      </div>
    </div>

    <!-- SS3: SITE-ONLY VA DOSSIER & CLIENT ASSIGNMENT CARD -->
    <section id="va-dossier-section" class="hidden space-y-4"></section>

    <!-- SS1: SITE-ONLY WEEKLY SOW ALIGNMENT / PROBATIONARY DAILY TASKS DRAWER -->
    <section id="sow-alignment-section" class="hidden"></section>

    <div id="save-toast" class="hidden px-4 py-2 rounded-lg bg-emerald-900/80 border border-emerald-600 text-emerald-200 text-sm"></div>

    <!-- Daily Shift Log Table (with Global Date Range Filter, RL/EL Flags, SS2 Quick Tags & AM Comms) -->
    <div id="tab-content" class="overflow-x-auto bg-slate-900 border border-slate-800 rounded-2xl p-4">
      <p class="text-slate-500 text-sm">Select a synced tab above, or go to <a href="tabs.html" class="text-teal-400 underline">Select Tabs</a> to enable tabs.</p>
    </div>
  </main>

  <script type="module" src="./js/va-detail.js"></script>
</body>
</html>
