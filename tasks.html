<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitsune — TL Tasks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="bg-teal-950 border-b border-teal-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-xl font-bold text-white">Team Leader Tasks & Direct Follow-Ups</h1>
      <p class="text-xs text-teal-300">Track 1:1 coaching items, disciplinary pings, and operational to-dos</p>
    </div>
    <nav id="main-nav" class="flex flex-wrap gap-2"></nav>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-5">
    <form id="add-task-form" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <span class="text-xs font-bold text-slate-200 uppercase">Create New TL Task</span>
        <span class="text-xs text-rose-400 font-mono font-bold">Pending: <span id="pending-count">0</span></span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-12 gap-2.5">
        <input id="task-title" type="text" required placeholder="e.g. Follow up on Damstra login access..."
               class="md:col-span-5 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100" />
        <select id="task-va" class="md:col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-xs text-slate-200"></select>
        <select id="task-cat" class="md:col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-2 text-xs text-slate-200">
          <option>Attendance / Late</option>
          <option>1:1 Follow-up</option>
          <option>Performance & Quality</option>
          <option>Disciplinary / Pings</option>
          <option>Schedule & Leaves</option>
          <option>Others</option>
        </select>
        <select id="task-prio" class="md:col-span-1 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-slate-200">
          <option value="High">High</option>
          <option value="Medium" selected>Medium</option>
          <option value="Low">Low</option>
        </select>
        <input id="task-due" type="date" class="md:col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-2 py-2 text-xs text-slate-200 font-mono" />
      </div>
      <div class="flex justify-end">
        <button type="submit" class="bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs px-5 py-2 rounded-xl">+ Add Task</button>
      </div>
    </form>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
        <div class="flex gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <button type="button" data-status="Active" class="status-filter px-2.5 py-1 rounded bg-slate-800 text-white font-semibold">Active</button>
          <button type="button" data-status="Completed" class="status-filter px-2.5 py-1 rounded text-slate-400">Completed</button>
          <button type="button" data-status="All" class="status-filter px-2.5 py-1 rounded text-slate-400">All</button>
        </div>
        <div class="flex gap-2 text-xs">
          <select id="filter-cat" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-slate-300">
            <option value="All">All Categories</option>
            <option>Attendance / Late</option>
            <option>1:1 Follow-up</option>
            <option>Performance & Quality</option>
            <option>Disciplinary / Pings</option>
            <option>Schedule & Leaves</option>
            <option>Others</option>
          </select>
          <select id="filter-va" class="bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-slate-300"></select>
        </div>
      </div>

      <div id="tasks-list" class="space-y-2"></div>
    </div>
  </main>

  <script type="module" src="./js/tasks.js"></script>
</body>
</html>
