<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitsune — Select Tabs to Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/theme.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="bg-teal-950 border-b border-teal-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-xl font-bold text-white">Manage Synced Google Sheet Tabs</h1>
      <p class="text-xs text-teal-300">Choose which tabs sync into Firebase</p>
    </div>
    <nav id="main-nav" class="flex flex-wrap gap-2"></nav>
  </header>

  <main class="max-w-3xl mx-auto p-6">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <p class="text-sm text-slate-300">Checked tabs sync in real time with your dashboard.</p>
        <div class="flex gap-2">
          <button id="select-all-btn" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 rounded">Select All</button>
          <button id="clear-all-btn" class="px-3 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 rounded">Clear</button>
        </div>
      </div>

      <div id="tab-list" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-[420px] overflow-y-auto py-2">
        <p class="text-slate-500 text-sm">Loading available tabs...</p>
      </div>

      <div class="flex items-center justify-between pt-4 border-t border-slate-800">
        <span id="status-msg" class="text-xs text-teal-300"></span>
        <button id="save-sync-btn" class="px-5 py-2 bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold rounded-lg">
          Save &amp; Sync Selected Tabs
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="./js/tabs.js"></script>
</body>
</html>
